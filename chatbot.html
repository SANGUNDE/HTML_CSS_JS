<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova 2.0</title>
</head>
<body>
    <h1>Conversaion</h1>
    <p><strong>NOVA:</strong>Bonjour</p>
    <p><strong>Vous:</strong>Quels sont vos horaires? </p>

    <label for="msg" id="msg">Ecrivez Votre message</label>
    <br>
    <textarea name="msg" id="msg" rows="1" cols="20"></textarea>
    <button type="submit">Envoyer</button>

    <p><strong>Voter Avis</strong></p>
    <input type="radio" for="1">
    <label for="1" id="1">1</label>

    <input type="radio" for="2">
    <label for="2" id="2">2</label>
    <input type="radio" for="3">
    <label for="3" id="3">3</label>
    <input type="radio" for="4">
    <label for="4" id="4">4</label>
    <input type="radio" for="5">
    <label for="5" id="5">5</label>
    <br>
    <br>
    <textarea name="commentaire" id="cmt" row="4" cols="30" 
    placeholder="un commentaire"></textarea>
    <br>
    <button type="submit">Envoyer mon avis</button>
</body>
</html>
